# Cutie composite pipeline config (LOCAL)
#
# Same as hpc but tuned for local testing (shorter clip, smaller resolution).

video_path: data/raw/multirat.avi

output:
  base_dir: outputs/runs
  video_codec: XVID
  write_individual_videos: true
  overlay_colors:
    - [0, 0, 255]
    - [0, 255, 0]
    - [255, 0, 0]
    - [255, 255, 0]
    - [255, 0, 255]
    - [0, 255, 255]

device: cuda

scan:
  max_frames: 900                  # 30s test clip
  preload_all_frames: false        # false = only the SAM3 phase is held in RAM, Cutie streams the rest; true = preload every frame

detection:
  max_animals: 6
  keypoint_min_conf: 0.3
  # orden verificado 2026-09-30 ejecutando yolo26_v11.pt sobre frames unitarios; debe coincidir con el orden de indices del modelo
  keypoint_names: [tail_tip, tail_base, tail_start, mid_body, nose, right_ear, left_ear]
  confidence: 0.25
  max_assignment_dist: 200

sam3:
  text_prompt: "mouse"
  score_threshold: 0.5
  init_retry_thresholds: [0.4, 0.3]   # if fewer than max_animals are found at the start, rerun the SAM3 phase with these
  init_retry_start_frames: [30, 60]   # then from these later frames (frames before them get no masks)
  require_all_animals: true           # abort the run (job fails) when an animal is still missing at the handoff

cutie:
  max_internal_size: 480           # lower for local (less VRAM). Bump to 720 if GPU allows
  mem_every: 5
  max_mem_frames: 5
  use_long_term: true

safety:
  checkpoint_interval: 150
  checkpoint_iou_threshold: 0.85
  protection_enabled: true
  fusion_enabled: true
  max_search_frames: 30
  fusion_area_tolerance: 0.15
  fusion_min_growth: 1.5

composition:
  erase_dilate_px: 15
  feather_px: 5
  mask_dilate_for_pick: 7
  unitary_feather_px: 3
  max_mask_carry_frames: 5

models:
  yolo_path: models/yolo/yolo26_v11.pt

background:
  cache_dir: outputs/backgrounds
  n_samples: 30
  sampling_seed: 42

contacts:
  enabled: true
  contact_zone_bl_enter: 0.30
  contact_zone_bl_exit: 0.45
  proximity_zone_bl: 1.0
  # --- calibration: the thresholds above are in body lengths (BL); these give their centimetre
  # equivalents in session_summary.json, event_log.txt and the Parameters sheet of results.xlsx ---
  cm_per_px: null   # measured arena scale; null = estimated from the body length below
  reference_body_length_cm: 9.5   # adult C57BL/6J nose to tail base (JAX Mouse Phenome Database: 9.7–10.1 cm at 20 months; young adults ~9–9.5 cm)
  nose_off_mask_radius_px: 3      # quality flag nose_off_mask: no pixel of the animal's own mask within this many px of its nose
  # SBS por borde compartido de mascaras (BL); el IoU es 0 con mascaras disjuntas
  mask_contact_dilate_px: 4
  sbs_contact_bl_enter: 0.35
  sbs_contact_bl_exit: 0.20
  sbs_latch_min_dist_score: 0.5     # el latch SBS exige cercania (evita cola-con-cola)
  follow_radius_bl: 0.4
  follow_radius_bl_exit: 0.6
  follow_min_speed_bls: 0.15
  follow_alignment_cos: 0.6
  # --- keys that were code defaults, now explicit (see final_documentation/06) ---
  min_keypoint_conf: 0.3            # keypoints below this are ignored for distances
  fallback_body_length_px: 120       # body length until the estimator warms up (measured 164 px on the 6-mouse video)
  social_anogenital_split: 0.55     # nose projected behind this fraction of nose->mid_body->tail_start = anogenital. MARS puts the genital boundary midway hips-tail base (~0.75-0.8)
  n2b_nose_mask_radius_px: 0        # 0 = nose pixel inside the other mask (strict); e.g. 6 = within 6 px of it (LMT-style touching)
  activation_threshold: 0.5
  activation_threshold_rare: 0.35
  secondary_threshold: 0.4
  bout_max_gap_frames: 3
  bout_min_frames_n2n: 6
  bout_min_frames_n2ag: 6
  bout_min_frames_fol: 12
  bout_min_frames_sbs: 6
  bout_min_frames_n2b: 6