# Cutie composite pipeline config (LOCAL)
#
# Same as hpc but tuned for local testing (shorter clip, smaller resolution).

video_path: data/raw/multirat.avi

output:
  base_dir: outputs/runs
  video_codec: XVID
  write_individual_videos: true
  overlay_colors:
    - [0, 0, 255]
    - [0, 255, 0]
    - [255, 0, 0]
    - [255, 255, 0]
    - [255, 0, 255]
    - [0, 255, 255]

device: cuda

scan:
  max_frames: 900                  # 30s test clip

detection:
  max_animals: 6
  keypoint_min_conf: 0.3
  keypoint_names: [nose, left_ear, right_ear, mid_body, tail_base]
  confidence: 0.25
  max_assignment_dist: 200

sam3:
  text_prompt: "mouse"
  score_threshold: 0.5

cutie:
  max_internal_size: 480           # lower for local (less VRAM). Bump to 720 if GPU allows
  mem_every: 5
  max_mem_frames: 5
  use_long_term: true

safety:
  checkpoint_interval: 150
  checkpoint_iou_threshold: 0.85
  protection_enabled: true
  fusion_enabled: true
  max_search_frames: 30
  fusion_area_tolerance: 0.15
  fusion_min_growth: 1.5

composition:
  erase_dilate_px: 15
  feather_px: 5
  mask_dilate_for_pick: 7
  unitary_feather_px: 3
  max_mask_carry_frames: 5

models:
  yolo_path: models/yolo/yolo26_v11.pt

background:
  cache_dir: outputs/backgrounds
  num_samples: 30
  seed: 42

contacts:
  enabled: true
  contact_zone_bl_enter: 0.30
  contact_zone_bl_exit: 0.45
  proximity_zone_bl: 1.0
  sbs_mask_iou_enter: 0.05
  sbs_mask_iou_exit: 0.02
  follow_radius_bl: 0.4
  follow_radius_bl_exit: 0.6
  follow_min_speed_bls: 0.15
  follow_alignment_cos: 0.6
  activation_threshold: 0.5
  activation_threshold_rare: 0.35
  secondary_threshold: 0.4
  bout_max_gap_frames: 3
  bout_min_frames_n2n: 6
  bout_min_frames_n2ag: 6
  bout_min_frames_t2t: 6
  bout_min_frames_fol: 12
  bout_min_frames_sbs: 6
  bout_min_frames_n2b: 6