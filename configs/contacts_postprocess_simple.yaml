# ============================================================================
# Contacts Post-Processing Configuration (Simple 3-Rule Pipeline)
# ============================================================================
# Temporal filtering to convert noisy per-frame contact labels into clean
# behavioral events. See docs/contacts_postprocess_simple.md for research basis.
#
# This file is read automatically by the pipeline (scripts/postprocess_contacts_simple.py,
# run_postprocess) and by the CLI. The values below are the ones applied to every run
# so far; they match the former built-in defaults. The literature-based alternative
# (window 7, gap 5, 0.5 s) is noted per rule: change it here, nowhere else.
#
# Usage:
#   python scripts/postprocess_contacts_simple.py path/to/contacts/
#   python scripts/postprocess_contacts_simple.py path/to/contacts/ \
#       --config configs/contacts_postprocess_simple.yaml --make_reports
#   python scripts/postprocess_contacts_simple.py path/to/contacts/ \
#       smoothing.window=7 min_bout.duration_sec=0.5
# ============================================================================

# --- Rule 1: Majority-vote smoothing ---
# Slides a window over per-frame contact labels. Each frame adopts the
# most frequent label in its window. Corrects 1-2 frame flickers.
# MARS: 3-frame average. 7-frame window (~233ms) catches 2-3 frame flickers
# while staying short enough to preserve real transitions.
smoothing:
  window: 5              # frames (must be odd). ~167ms at 30fps. Literature option: 7.

# --- Rule 2: Gap bridging ---
# If the same contact type reappears within max_gap frames of ending,
# the gap is filled and the bout continues.
# MARS: 1-3 frame FN as dominant error. JAABA: gap-fill before min-bout.
# 5 frames (~167ms) bridges brief detector dropouts without merging distinct bouts.
gap_bridging:
  max_gap: 3             # frames. ~100ms at 30fps. Literature option: 5.

# --- Rule 3: Minimum bout duration ---
# After smoothing and gap bridging, bouts shorter than this are removed.
# A-SOiD: 200ms floor, 400ms default. SimBA: per-classifier thresholds.
# 500ms ensures only sustained interactions are reported — rats need ~300ms
# minimum for meaningful social contact (literature consensus).
min_bout:
  duration_sec: 0.3      # seconds (9 frames at 30fps). Literature option: 0.5.
  # Per-type minimums on top of duration_sec (seconds). Empty = none. The tracker's
  # own bout minimum for FOL is 12 frames (0.4 s); Live Mouse Tracker drops follow
  # events shorter than 7 frames. To align the reported events with the tracker:
  #   by_type: {FOL: 0.4}
  by_type: {FOL: 0.4}

# --- Investigation bouts (additional output; events and tables above are unchanged) ---
# Per pair, N2N, N2AG and N2B are merged into one "close investigation" class (MARS scores
# it that way and names face / body / genital afterwards). A bout is a maximal run of these
# cleaned labels; up to max_gap frames of any other label (NC, FOL, SBS) inside it are bridged.
# Why: when the nose slides between the flank and the rear of the other animal the per-frame
# label alternates between N2AG and N2B, which cuts one investigation into several events.
# Written to investigation_bouts.csv (sheet Investigation), session_summary_real.json
# ("investigation") and the "Investigation bouts" block of event_log.txt.
investigation:
  max_gap: 3             # frames. ~100ms at 30fps.

# --- Brief interactions (additional output; Events is unchanged) ---
# Runs that survive smoothing and gap bridging but are removed whole by min_bout
# (shorter than 0.3 s, or 0.4 s for FOL). Only runs of at least min_frames are listed;
# shorter ones are mostly 1-2 frame flicker. At 30 fps: 3-8 frames (FOL 3-11).
# Written to brief_events.csv (sheet Brief of diagnostics.xlsx). Not validated.
brief:
  enabled: true
  min_frames: 3          # frames. 100 ms at 30 fps.

# --- Following episodes (contact_rules_v3 runs; additional output) ---
# FOL events and N2AG events made while both animals walk, of the same pair and the same
# follower, merged when the gap between them is at most max_gap_sec.
# Written to following_episodes.csv (sheet Following of diagnostics.xlsx). Not validated.
following:
  max_gap_sec: 0.5       # seconds. 15 frames at 30 fps.

# --- Groups (column `group` in Events, `real_group` in PerFrame, sheet Grupos) ---
# Contact types that look alike, joined: level 1 = group (safest), level 2 = type,
# level 3 = subtype. Each type + subtype goes to ONE group, so totals by group never count
# a frame twice. "default" is used when the subtype is missing (runs without v3).
groups:
  N2N:  {frontal: "Cara a cara", perpendicular: "Cara a cara", lateral: "Lado a lado", default: "Cara a cara"}
  SBS:  {default: "Lado a lado"}
  N2AG: {classic: "Olfateo anogenital", following: "Persecución", default: "Olfateo anogenital"}
  N2B:  {default: "Olfateo corporal"}
  FOL:  {default: "Persecución"}

# --- FPS fallback ---
# Used only if no --fps flag, no session_summary.json, and no --video_path.
fps_fallback: 30.0
