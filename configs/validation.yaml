# Defaults for scripts/validate_contacts.py (override with key=value on the CLI)
per_type: 15            # events sampled per contact type (stratified by duration tertile)
pad_sec: 1.0            # context before/after each event in the clip
speed: 0.5              # playback speed (0.5 = slow motion)
seed: 42
crf: 23                 # H.264 quality
source: null            # events | bouts | null (auto: events if it has pair_key, else bouts)
types: null             # e.g. "N2N,SBS"; null = all types present
group_by: scene         # scene = one clip per group of overlapping events (one review row per event); event = one clip per event
max_scene_sec: 12       # longest clip (video seconds); longer chains of events are split into several scenes
nc_windows: 0           # no-contact windows sampled for the recall proxy (0 = off; CLI --nc-per-run N)
nc_window_sec: 3.0      # length of each NC window (s); NC spans shorter than 2 * pad_sec are not used
nc_near_bl: 1.0         # windows where the pair's centroid distance drops below this (body lengths) are drawn first
duration_bins: [0.3, 0.5, 1.0, 2.0]        # seconds; edges for flicker-rate bins
score_grid: [0.0, 0.5, 0.6, 0.7, 0.8, 0.9]  # peak_score thresholds for precision table
duration_grid: [0.0, 0.2, 0.3, 0.5, 1.0, 2.0]  # minimum-duration thresholds (s)
identity:               # `validate_contacts.py identity <run>`: do the labels stay on the same animal over a long session?
  every_sec: 60         # seconds between checkpoint frames (CLI --every, or identity.every_sec=30)
  max_frames: 40        # most checkpoints; a longer session is sampled evenly (CLI --max)
